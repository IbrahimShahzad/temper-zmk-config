    - ''''
    - $
    - (
    - )
    - {t: '-', s: _}
    - {t: '=', s: +}
    - +
    - '%'
  - - /
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ;, s: ':'}
    - ':'
    - {t: ., s: '>'}
    - {t: ',', s: <}
    - '&'
    - '|'
    - \
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: RET, h: code}
    - {t: ▽, type: trans}
