  - - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - {t: ',', s: ;}
    - {t: ., s: ':'}
    - {t: '=', s: '!'}
  - - {t: ESC, s: '`'}
    - {t: BACKSPACE, h: vim}
    - {t: ↹, h: num}
    - {t: SPACE, h: sym}
    - {t: RET, h: code}
    - {t: ⇧, s: ⇪}
  sym:
  - - '~'
    - {t: '`', s: '~'}
    - {t: '[', s: '{'}
    - '{'
    - <
    - '>'
    - '}'
    - {t: ']', s: '}'}
