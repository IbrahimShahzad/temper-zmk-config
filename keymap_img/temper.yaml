    - {t: ▽, type: trans}
    - BRI UP
    - VOL UP
    - '*'
    - '7'
    - '8'
    - '9'
    - {t: '-', s: _}
  - - {t: ▽, type: trans}
    - PREV
    - PP
    - NEXT
    - VOL DN
    - {t: ., s: '>'}
    - '4'
    - '5'
    - '6'
    - +
  - - {t: ▽, type: trans}
