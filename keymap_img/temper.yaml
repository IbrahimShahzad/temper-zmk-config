layout: {zmk_keyboard: temper}
layers:
  default:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - A
    - {t: S, h: ⎇}
    - {t: D, h: ⌃}
    - {t: F, h: ⌘}
    - G
    - H
    - {t: J, h: ⌘}
    - {t: K, h: ⌃}
    - {t: L, h: ⎇}
    - {t: '''', s: '"'}
  - - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - {t: ',', s: ;}
    - {t: ., s: ':'}
    - {t: '?', s: '!'}
  - - {t: ⌃, h: sticky}
    - num
    - {t: ⇧, s: ⇪}
    - SPACE
    - nav
    - cmd
  num:
  - - {t: '~', s: '`'}
    - '@'
    - '{'
    - '}'
    - '%'
    - '*'
    - '7'
    - '8'
    - '9'
    - {t: '-', s: _}
  - [^, '#', (, ), $, _, '4', '5', '6', +]
  - - {t: '&', s: '|'}
    - <
    - {t: '[', s: '{'}
    - {t: ']', s: '}'}
    - '>'
    - {t: /, s: \}
    - '1'
    - '2'
    - '3'
    - {t: '=', s: +}
  - - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - '0'
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  nav:
  - - LOCK
    - W
    - (
    - )
    - {t: ▽, type: trans}
    - DEL
    - HOME
    - END
    - ↹
    - BSPC
  - - {t: '[', s: '{'}
    - {t: ']', s: '}'}
    - N
    - P
    - S
    - ←
    - ↓
    - ↑
    - →
    - {t: ESC, s: '`'}
  - - {t: Ctl+B, h: sticky}
    - Z
    - '{'
    - '}'
    - X
    - /
    - RET
    - '*'
    - '%'
    - \
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
  fun:
  - [LOCK, MUTE, VOL DN, VOL UP, OUT USB, default, F7, F8, F9, F12]
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - {t: ▽, type: trans}
    - F4
    - F5
    - F6
    - F11
  - - BT CLR
    - PREV
    - PP
    - NEXT
    - OUT BLE
    - {t: ▽, type: trans}
    - F1
    - F2
    - F3
    - F10
  - - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
  cmd:
  - - LOCK
    - Ctl+Y
    - Ctl+O
    - Gui+P
    - Ctl+R
    - default
    - ⌘W
    - Gui+T
    - ⌘Z
    - {t: ▽, type: trans}
  - - {t: Ctl+W, h: sticky}
    - Ctl+N
    - Ctl+J
    - V
    - W
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - {t: Ctl+B, h: sticky}
    - ⌘X
    - ⌘C
    - ⌘V
    - D
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
