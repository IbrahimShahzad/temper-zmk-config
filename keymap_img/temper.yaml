    - {t: '[', s: '{'}
    - '{'
    - <
    - '>'
    - '}'
    - {t: ']', s: '}'}
    - '*'
    - _
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - '!'
    - '@'
    - (
    - )
    - {t: '-', s: _}
    - {t: '=', s: +}
    - +
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - ^
    - '&'
    - '|'
    - {t: ▽, type: trans}
