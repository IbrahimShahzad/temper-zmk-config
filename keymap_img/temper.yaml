  - [Q, W, E, R, T, PG UP, HOME, END, PG DN, POWER]
  - [A, S, D, '*', G, ←, ↓, ↑, →, '%']
  - - /
    - X
    - C
    - V
    - B
    - ^
    - '0'
    - $
    - {t: ., s: ':'}
